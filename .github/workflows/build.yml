name: Build and Test

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Build and Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # We "float" the bug fix so we pick up new ones. This helps since the GitHub CI
        # is set to ensure the actions pass, thus updates are only needed when the
        # "major.minor" pairs changes.
        #
        # Looking at https://hub.docker.com/_/swift, the version only tags (i.e. - 6.1)
        # could use different Ubuntu releases. At the moment they are all the "noble",
        # which is also what would be desired, so we don't bother listing explicit ones.
        swift: ["6.3", "6.2", "6.1"]
        traits: ["default", "disable-default-traits", "BinaryDelimitedStreams", "FieldMaskUtilities"]

        include:
          - traits: "default"
            flags: ""
          - traits: "disable-default-traits"
            flags: "--disable-default-traits"
          - traits: "BinaryDelimitedStreams"
            flags: "--traits BinaryDelimitedStreams"
          - traits: "FieldMaskUtilities"
            flags: "--traits FieldMaskUtilities"
    name: Swift ${{ matrix.swift }} | Traits - ${{ matrix.traits }}
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Update and install dependencies
      # Just ensure we have the latest `g++` for building protoc (since it is
      # built by SwiftPM), full dependencies available at
      # https://github.com/protocolbuffers/protobuf/blob/main/src/README.md
      #
      # `make` is needed for using our own `Makefile`.
      run: apt-get update && apt-get install -y make g++
    - name: Build
      run: make build SWIFT_BUILD_TEST_HOOK="-Xswiftc -warnings-as-errors ${{ matrix.flags }}"
    - name: Test runtime
      run: make test-runtime SWIFT_BUILD_TEST_HOOK="-Xswiftc -warnings-as-errors ${{ matrix.flags }}"
    - name: Test plugin
      if: ${{ matrix.traits == 'default' }}
      run: make test-plugin
    - name: Test SPM plugin
      if: ${{ matrix.traits == 'default' }}
      run: make test-spm-plugin

  compile_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.2", "6.1"]
    name: Swift ${{ matrix.swift }} | Compilation Tests
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Update and install dependencies
      # Just ensure we have the latest `g++` for building protoc (since it is
      # built by SwiftPM), full dependencies available at
      # https://github.com/protocolbuffers/protobuf/blob/main/src/README.md
      #
      # `make` is needed for using our own `Makefile`.
      run: apt-get update && apt-get install -y make g++
    - name: Compilation Tests
      run: make compile-tests

  linkage-test:
    runs-on: ubuntu-latest
    name: Foundation linkage test
    container:
      image: swift:latest
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Update and install dependencies
      # Just ensure we have the latest `g++` for building protoc (since it is
      # built by SwiftPM), full dependencies available at
      # https://github.com/protocolbuffers/protobuf/blob/main/src/README.md
      run: apt-get update && apt-get install -y g++
    - name: Run linkage test
      run: ./scripts/run-linkage-test.sh

  api-breakage:
    name: Api Breakage Compared to main branch
    # Only on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      # Test on the latest Swift release. This could run on all the support
      # Swift versions, but that doesn't seem worth it until there are Swift
      # version specific conditionals to justify it.
      image: swift:latest
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Mark the workspace as safe
      # https://github.com/actions/checkout/issues/766
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Check for API breaking changes
      run: swift package diagnose-api-breaking-changes origin/main

  format-check:
    name: swift-format Check
    # Only on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      # Use use the latest Swift release and that's the version of swift-format
      # people should use.
      image: swift:latest
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Mark the workspace as safe
      # https://github.com/actions/checkout/issues/766
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Run format check
      run:  |
        set -eu
        git ls-files -z '*.swift' | xargs -0 swift format format --parallel --in-place
        GIT_PAGER='' git diff --exit-code '*.swift'
    - name: Run format lint check
      run:  |
        set -eu
        git ls-files -z '*.swift' | xargs -0 swift format lint --strict --parallel

  sanitizer_testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "undefined", "scudo" not supported on x86_64.
        sanitizer: ["address", "thread"]
        swiftpm_config: ["debug", "release"]
    container:
      # Test on the latest Swift release.
      image: swift:latest
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Test
      run: |
        set -eu
        # Trim out the generate files that are just compile tests, they take a while to compile and
        # are covered in core instead.
        rm Tests/SwiftProtobufTests/generated_swift_names*
        # On linux, the tests seem to always see leaks that don't show up on macOS. Disable the
        # leak detection and just assume it is a Linux Swift issue. This still gets validation
        # for other memory errors. Maybe https://github.com/swiftlang/swift/issues/49397
        if [ "${{ matrix.sanitizer }}" = "address" ] ; then
          export ASAN_OPTIONS=detect_leaks=0
        fi
        swift test -c ${{ matrix.swiftpm_config }} --sanitize=${{ matrix.sanitizer }}

  fuzzing_regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swiftpm_config: ["debug", "release"]
    container:
      # Test on the latest Swift release.
      image: swift:latest
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Build
      run: FuzzTesting/do_build.sh --${{ matrix.swiftpm_config }}-only --run-regressions
